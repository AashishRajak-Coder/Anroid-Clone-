\name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Generate Gradle Wrapper
      run: |
        # Create wrapper directory
        mkdir -p gradle/wrapper
        
        # Download wrapper jar
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
        
        # Create properties file
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https://services.gradle.org/distributions/gradle-8.2-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        # Create gradlew
        cat > gradlew << 'EOF'
        #!/bin/sh
        APP_BASE_NAME=${0##*/}
        APP_HOME=$( cd "${APP_HOME:-./}" && pwd -P ) || exit
        CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
        exec java -Xmx64m -Xms64m -Dorg.gradle.appname="$APP_BASE_NAME" -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
        EOF
        
        # Create gradlew.bat
        cat > gradlew.bat << 'EOF'
        @echo off
        set APP_BASE_NAME=%~n0
        set APP_HOME=%DIRNAME%
        set CLASSPATH=%APP_HOME%\gradle\wrapper\gradle-wrapper.jar
        java -Xmx64m -Xms64m -Dorg.gradle.appname=%APP_BASE_NAME% -classpath "%CLASSPATH%" org.gradle.wrapper.GradleWrapperMain %*
        EOF
        
        # Make executable
        chmod +x gradlew
    
    - name: List files for debug
      run: |
        echo "=== Repository Files ==="
        ls -la
        echo ""
        echo "=== Gradle Wrapper Files ==="
        ls -la gradle/wrapper/
        echo ""
        echo "=== gradlew ==="
        ls -la gradlew
    
    - name: Build APK
      run: ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
